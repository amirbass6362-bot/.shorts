                  counter.setTextColor(Color.WHITE)
                  counter.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                  counter.setPadding(dp(14), dp(6), dp(14), dp(6))
                  counter.visibility = View.GONE
                  counter.background = GradientDrawable().apply {
