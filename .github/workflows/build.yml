              private fun showMessage(text: String, withButton: Boolean) {
                  msgText.text = text
                  msgBtn.visibility = if (withButton) View.VISIBLE else View.GONE
                  msg.visibility = View.VISIBLE
              }

              private fun loadVideos(): MutableList<Item> {
                  val out = mutableListOf<Item>()
                  val base = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  val proj = arrayOf(MediaStore.Video.Media._ID, MediaStore.Video.Media.DISPLAY_NAME)
                  contentResolver.query(base, proj, null, null, MediaStore.Video.Media.DATE_ADDED + " DESC")?.use { c ->
                      val idCol = c.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                      val nameCol = c.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                      while (c.moveToNext()) {
                          val id = c.getLong(idCol)
                          val name = c.getString(nameCol) ?: ""
                          out.add(Item(id, name, ContentUris.withAppendedId(base, id)))
                      }
                  }
                  return out
              }

              private fun start() {
                  if (videoAdapter != null) return
