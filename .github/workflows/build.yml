          }

          class VideoPage(ctx: Context) : FrameLayout(ctx) {
              private val video = VideoView(ctx)
              private val title = TextView(ctx)
              private val pauseIcon = TextView(ctx)
              private val fill = View(ctx)
              private val likeBtn = ctx.roundButton("â™¡")
              private val muteBtn = ctx.roundButton("ðŸ”Š")
              private val ui = Handler(Looper.getMainLooper())
              private var item: Item? = null
              private var mp: MediaPlayer? = null
              private var loaded = false
              private var prepared = false
              private var active = false

              private val tick = object : Runnable {
                  override fun run() {
                      val d = video.duration
                      if (prepared && d > 0) fill.scaleX = video.currentPosition.toFloat() / d
                      ui.postDelayed(this, 150)
                  }
              }

              init {
                  layoutDirection = View.LAYOUT_DIRECTION_LTR
                  setBackgroundColor(Color.BLACK)
                  addView(video, FrameLayout.LayoutParams(-1, -1, Gravity.CENTER))

                  title.setTextColor(Color.WHITE)
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                  title.maxLines = 2
                  title.setShadowLayer(6f, 0f, 1f, Color.BLACK)
                  addView(title, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM).apply {
                      leftMargin = ctx.dp(16); rightMargin = ctx.dp(80); bottomMargin = ctx.dp(28)
                  })

                  val rail = LinearLayout(ctx)
                  rail.orientation = LinearLayout.VERTICAL
                  rail.addView(likeBtn, LinearLayout.LayoutParams(ctx.dp(48), ctx.dp(48)))
                  rail.addView(muteBtn, LinearLayout.LayoutParams(ctx.dp(48), ctx.dp(48)).apply { topMargin = ctx.dp(12) })
                  addView(rail, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.RIGHT).apply {
                      rightMargin = ctx.dp(12); bottomMargin = ctx.dp(28)
                  })

                  pauseIcon.text = "â–¶"
                  pauseIcon.setTextColor(0xCCFFFFFF.toInt())
                  pauseIcon.setTextSize(TypedValue.COMPLEX_UNIT_SP, 56f)
                  pauseIcon.visibility = View.GONE
                  addView(pauseIcon, FrameLayout.LayoutParams(-2, -2, Gravity.CENTER))

                  val track = View(ctx)
                  track.setBackgroundColor(0x33FFFFFF)
                  addView(track, FrameLayout.LayoutParams(-1, ctx.dp(3), Gravity.BOTTOM))
                  fill.setBackgroundColor(0xFFFFB703.toInt())
                  fill.pivotX = 0f
                  fill.scaleX = 0f
                  addView(fill, FrameLayout.LayoutParams(-1, ctx.dp(3), Gravity.BOTTOM))

                  video.setOnPreparedListener { m ->
                      mp = m
                      prepared = true
                      m.isLooping = true
                      applyVolume()
                      if (active) startPlay()
                  }
                  video.setOnErrorListener { _, _, _ -> true }

                  setOnClickListener {
                      if (!prepared) return@setOnClickListener
                      if (video.isPlaying) {
                          video.pause()
                          pauseIcon.visibility = View.VISIBLE
                      } else {
                          startPlay()
                      }
                  }
                  likeBtn.setOnClickListener {
                      val cur = item ?: return@setOnClickListener
                      if (!State.liked.remove(cur.id)) State.liked.add(cur.id)
                      refreshButtons()
                  }
                  muteBtn.setOnClickListener {
                      State.muted = !State.muted
                      applyVolume()
                      refreshButtons()
                  }
              }

              private fun refreshButtons() {
                  val cur = item
                  val liked = cur != null && State.liked.contains(cur.id)
                  likeBtn.text = if (liked) "â™¥" else "â™¡"
                  likeBtn.setTextColor(if (liked) 0xFFFFB703.toInt() else Color.WHITE)
                  muteBtn.text = if (State.muted) "ðŸ”‡" else "ðŸ”Š"
              }

              private fun applyVolume() {
                  val v = if (State.muted) 0f else 1f
                  mp?.setVolume(v, v)
              }

              fun bind(data: Item, isActive: Boolean) {
                  item = data
                  prepared = false
                  active = isActive
                  fill.scaleX = 0f
                  pauseIcon.visibility = View.GONE
                  title.text = data.name.substringBeforeLast('.')
                  refreshButtons()
                  loaded = true
                  video.setVideoURI(data.uri)
              }

              fun attach() {
                  val data = item ?: return
                  if (!loaded) {
                      prepared = false
                      loaded = true
                      video.setVideoURI(data.uri)
                  }
              }

              fun detach() {
                  ui.removeCallbacks(tick)
                  video.stopPlayback()
                  loaded = false
                  prepared = false
              }

              fun setActive(a: Boolean) {
                  if (a) play() else pause(true)
              }

              fun play() {
                  active = true
                  if (prepared) startPlay()
              }

              fun pause(rewind: Boolean) {
                  active = false
                  ui.removeCallbacks(tick)
                  if (prepared) {
                      if (video.isPlaying) video.pause()
                      if (rewind) video.seekTo(0)
                  }
              }

              private fun startPlay() {
                  pauseIcon.visibility = View.GONE
                  applyVolume()
                  video.start()
                  ui.removeCallbacks(tick)
                  ui.post(tick)
              }
          }

          class VH(val page: VideoPage) : RecyclerView.ViewHolder(page)

          class VideoAdapter(val items: MutableList<Item>) : RecyclerView.Adapter<VH>() {
              var current = 0
              val attached = HashSet<VH>()

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val page = VideoPage(parent.context)
                  page.layoutParams = ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                  )
                  return VH(page)
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  holder.page.bind(items[position], position == current)
              }

              override fun getItemCount(): Int = items.size

              override fun onViewAttachedToWindow(holder: VH) {
                  super.onViewAttachedToWindow(holder)
                  attached.add(holder)
                  holder.page.attach()
                  if (holder.adapterPosition == current) holder.page.play()
              }

              override fun onViewDetachedFromWindow(holder: VH) {
                  super.onViewDetachedFromWindow(holder)
                  attached.remove(holder)
                  holder.page.detach()
              }

              fun select(pos: Int) {
                  current = pos
                  for (h in attached) h.page.setActive(h.adapterPosition == pos)
              }
          }

          class MainActivity : Activity() {
